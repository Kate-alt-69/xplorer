name: Native Windows Stack

on:
  push:
    branches:
      - rewrite/native-winui
    paths:
      - 'apps/native/**'
      - 'apps/worker/**'
      - 'installer/**'
      - 'scripts/build-native.ps1'
      - 'scripts/build-installer.ps1'
      - '.github/workflows/native-winui.yml'
  pull_request:
    paths:
      - 'apps/native/**'
      - 'apps/worker/**'
      - 'installer/**'
      - 'scripts/build-native.ps1'
      - 'scripts/build-installer.ps1'
      - '.github/workflows/native-winui.yml'

concurrency:
  group: native-winui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create git-ready source snapshot
        shell: pwsh
        run: |
          git remote set-url origin https://github.com/Kate-alt-69/xplorer.git
          git config --local --unset-all http.https://github.com/.extraheader 2>$null
          git config --local core.autocrlf false
          git reset --hard HEAD
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar.exe -a -c -f dist/Xplorer-source-git-ready.zip --exclude='./dist' .
          if ($LASTEXITCODE -ne 0) { throw "Source snapshot archive failed with exit code $LASTEXITCODE." }

      - name: Upload git-ready source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-source-git-ready
          path: dist/Xplorer-source-git-ready.zip
          if-no-files-found: error
          retention-days: 14

      - name: Select stable Rust
        run: rustup default stable

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup NSIS
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install nsis --yes --no-progress
          }

      - name: Build and package native Xplorer
        shell: pwsh
        run: ./scripts/build-native.ps1 -Configuration Release -Runtime win-x64 -Package

      - name: Build upgrade installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Configuration Release -Runtime win-x64 -Version 1.0.0-alpha.1 -SkipNativeBuild

      - name: Measure idle worker memory
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'apps/worker/target/release/xplorer.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--idle-probe' -PassThru
          try {
            Start-Sleep -Milliseconds 750
            $process.Refresh()
            $workingSetKiB = [math]::Round($process.WorkingSet64 / 1KB, 1)
            $privateKiB = [math]::Round($process.PrivateMemorySize64 / 1KB, 1)
            Write-Host "Xplorer worker idle working set: $workingSetKiB KiB"
            Write-Host "Xplorer worker idle private memory: $privateKiB KiB"
            Write-Host "::notice title=Xplorer worker idle memory::Working set $workingSetKiB KiB; private memory $privateKiB KiB"
          }
          finally {
            & $exe --stop-service-worker
            if (-not $process.WaitForExit(5000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Verify packaged app
        shell: pwsh
        run: |
          $publicHost = Resolve-Path 'dist/Xplorer-win-x64/xplorer.exe'
          $nativeUi = Resolve-Path 'dist/Xplorer-win-x64/Xplorer.Native.exe'
          $archive = Resolve-Path 'dist/Xplorer-win-x64.zip'
          $installer = Resolve-Path 'dist/Xplorer-Setup-x64.exe'
          Write-Host "Public host: $publicHost"
          Write-Host "Native UI: $nativeUi"
          Write-Host "Archive: $archive"
          Write-Host "Installer: $installer"

      - name: Smoke-test native UI startup
        shell: pwsh
        run: |
          $ui = (Resolve-Path 'dist/Xplorer-win-x64/Xplorer.Native.exe').Path
          $startupLog = Join-Path $env:LOCALAPPDATA 'Xplorer\Logs\startup.log'
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $ui -PassThru
          try {
            Start-Sleep -Seconds 2
            $process.Refresh()
            if ($process.HasExited) {
              if (Test-Path $startupLog) {
                Write-Host '--- Xplorer startup.log ---'
                Get-Content $startupLog
              }
              Write-Host '--- recent Application events ---'
              Get-WinEvent -FilterHashtable @{ LogName='Application'; StartTime=(Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
                Where-Object { $_.Message -match 'Xplorer.Native|Microsoft.UI.Xaml|WindowsAppRuntime' } |
                Select-Object -First 10 TimeCreated, Id, ProviderName, LevelDisplayName, Message |
                Format-List
              throw "Xplorer.Native.exe exited during the 2 second startup smoke test with code $($process.ExitCode)."
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Smoke-test installer reinstall and data preservation
        shell: pwsh
        run: |
          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string]$Arguments,
              [Parameter(Mandatory = $true)][string]$Label,
              [int]$TimeoutSeconds = 90
            )

            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -PassThru
            try {
              if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                throw "$Label timed out after $TimeoutSeconds seconds."
              }
              $process.Refresh()
              if ($process.ExitCode -ne 0) {
                throw "$Label failed with exit code $($process.ExitCode)."
              }
            }
            finally {
              $process.Dispose()
            }
          }

          $setup = (Resolve-Path 'dist/Xplorer-Setup-x64.exe').Path
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\Xplorer'
          $dataDir = Join-Path $env:LOCALAPPDATA 'Xplorer'
          $themeDir = Join-Path $dataDir 'Themes'
          $sentinel = Join-Path $themeDir 'ci-preserve.txt'
          $shellVerb = 'HKCU:\Software\Classes\Directory\shell\Xplorer.Native'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'

          Invoke-BoundedProcess -FilePath $setup -Arguments '/S' -Label 'First installer run'
          if (-not (Test-Path (Join-Path $installDir 'xplorer.exe'))) { throw 'Installed Rust host missing.' }
          if (-not (Test-Path (Join-Path $installDir 'Xplorer.Native.exe'))) { throw 'Installed WinUI executable missing.' }
          if (-not (Test-Path $shellVerb)) { throw 'Installed shell integration is missing.' }
          if (-not (Get-ItemProperty -Path $runKey -Name 'Xplorer Index Worker' -ErrorAction SilentlyContinue)) { throw 'Background worker startup registration is missing.' }
          if (-not (Get-Process -Name xplorer -ErrorAction SilentlyContinue)) { throw 'Background worker was not started by the installer.' }

          New-Item -ItemType Directory -Force -Path $themeDir | Out-Null
          Set-Content -Path $sentinel -Value 'preserve-me' -NoNewline

          Invoke-BoundedProcess -FilePath $setup -Arguments '/S' -Label 'Upgrade/reinstall'
          if (-not (Test-Path $sentinel)) { throw 'Installer upgrade removed Xplorer user data.' }
          if (-not (Test-Path $shellVerb)) { throw 'Upgrade lost Xplorer shell integration.' }
          if (-not (Get-ItemProperty -Path $runKey -Name 'Xplorer Index Worker' -ErrorAction SilentlyContinue)) { throw 'Upgrade lost background worker startup registration.' }

          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          Invoke-BoundedProcess -FilePath $uninstaller -Arguments '/S' -Label 'Uninstaller'
          if (Test-Path (Join-Path $installDir 'xplorer.exe')) { throw 'Uninstaller left program files behind.' }
          if (Test-Path $shellVerb) { throw 'Uninstaller left Xplorer shell integration behind.' }
          if (Get-ItemProperty -Path $runKey -Name 'Xplorer Index Worker' -ErrorAction SilentlyContinue) { throw 'Uninstaller left the background worker startup registration behind.' }
          if (-not (Test-Path $sentinel)) { throw 'Uninstaller deleted preserved user data.' }
          Remove-Item -Recurse -Force $dataDir -ErrorAction SilentlyContinue

      - name: Upload portable x64 package
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-win-x64
          path: dist/Xplorer-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: Xplorer-Setup-x64
          path: dist/Xplorer-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
