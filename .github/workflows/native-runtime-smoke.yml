name: Native Runtime Smoke

on:
  push:
    branches:
      - rewrite/native-winui
    paths:
      - 'apps/native/**'
      - 'apps/worker/**'
      - 'scripts/build-native.ps1'
      - '.github/workflows/native-runtime-smoke.yml'
  pull_request:
    paths:
      - 'apps/native/**'
      - 'apps/worker/**'
      - 'scripts/build-native.ps1'
      - '.github/workflows/native-runtime-smoke.yml'

concurrency:
  group: native-runtime-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-2022-runtime:
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select stable Rust
        run: rustup default stable

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build native Xplorer
        shell: pwsh
        run: ./scripts/build-native.ps1 -Configuration Release -Runtime win-x64

      - name: Exercise WinUI startup and runtime XAML probes
        shell: pwsh
        run: |
          $ui = (Resolve-Path 'dist/Xplorer-win-x64/Xplorer.Native.exe').Path
          $startupLog = Join-Path $env:LOCALAPPDATA 'Xplorer\Logs\startup.log'
          Remove-Item $startupLog -Force -ErrorAction SilentlyContinue
          $env:XPLORER_DEBUG_STARTUP = '1'
          $process = Start-Process -FilePath $ui -PassThru
          try {
            Start-Sleep -Seconds 6
            $process.Refresh()

            if (Test-Path $startupLog) {
              Write-Host '--- Xplorer startup.log ---'
              Get-Content $startupLog
            }

            if ($process.HasExited) {
              throw "Xplorer.Native.exe exited during runtime smoke test with code $($process.ExitCode)."
            }
            if (-not (Test-Path $startupLog)) {
              throw 'Xplorer produced no startup.log during runtime smoke test.'
            }

            $log = Get-Content $startupLog -Raw
            $fatalMarkers = @(
              'UI preflight control FAILED:',
              'UI preflight XAML FAILED:',
              'UI preflight action FAILED:',
              'MainWindow construction failed:',
              'Startup recovery window activated.',
              'App.OnLaunched:',
              'WinUI unhandled exception'
            )
            foreach ($marker in $fatalMarkers) {
              if ($log.Contains($marker, [StringComparison]::Ordinal)) {
                throw "Runtime smoke test detected failure marker: $marker"
              }
            }

            $requiredMarkers = @(
              'XamlControlsResources installed programmatically.',
              'UI preflight action OK: application Resources access',
              'UI preflight action OK: default XML theme parse',
              'UI preflight action OK: SettingsDialog compiled XAML',
              'UI preflight action OK: TerminalWorkspaceDialog compiled XAML',
              'MainWindow constructed.',
              'Theme support initialized.',
              'MainWindow activated.',
              'Startup completed.'
            )
            foreach ($marker in $requiredMarkers) {
              if (-not $log.Contains($marker, [StringComparison]::Ordinal)) {
                throw "Runtime smoke test did not reach required marker: $marker"
              }
            }
          }
          finally {
            Remove-Item Env:XPLORER_DEBUG_STARTUP -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path 'dist/runtime-diagnostics' | Out-Null
            if (Test-Path $startupLog) {
              Copy-Item $startupLog 'dist/runtime-diagnostics/startup.log' -Force
            }
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Exercise public folder-launch aliases
        shell: pwsh
        run: |
          $hostExe = (Resolve-Path 'dist/Xplorer-win-x64/xplorer.exe').Path
          $target = (Resolve-Path 'apps/native/Xplorer.Native').Path
          $startupLog = Join-Path $env:LOCALAPPDATA 'Xplorer\Logs\startup.log'
          $hostLog = Join-Path $env:LOCALAPPDATA 'Xplorer\Logs\host.log'
          Remove-Item $startupLog, $hostLog -Force -ErrorAction SilentlyContinue

          # This is the exact compatibility spelling that regressed on Windows 10. Keep it in CI so
          # CLI parser refactors cannot silently turn an explicit folder request into session restore.
          $process = Start-Process -FilePath $hostExe -ArgumentList @('-debug', '-test-open-folder', $target) -PassThru
          try {
            Start-Sleep -Seconds 7

            if (-not (Test-Path $startupLog)) {
              throw 'Public folder-launch smoke produced no startup.log.'
            }
            $log = Get-Content $startupLog -Raw
            Write-Host '--- Xplorer explicit-folder startup.log ---'
            Write-Host $log

            if (-not $log.Contains('ExplicitFolder=True', [StringComparison]::Ordinal)) {
              throw 'Native launch parser did not classify -test-open-folder as an explicit folder request.'
            }
            if ($log.Contains("Creating MainWindow. InitialFolder='<session>'", [StringComparison]::Ordinal)) {
              throw 'Explicit folder launch incorrectly fell back to session restore.'
            }
            if (-not $log.Contains('Creating MainWindow. InitialFolder=', [StringComparison]::Ordinal)) {
              throw 'Explicit folder launch never reached MainWindow creation.'
            }
            if (-not $log.Contains('MainWindow activated.', [StringComparison]::Ordinal)) {
              throw 'Explicit folder launch did not activate the native window.'
            }
          }
          finally {
            New-Item -ItemType Directory -Force -Path 'dist/runtime-diagnostics' | Out-Null
            if (Test-Path $startupLog) {
              Copy-Item $startupLog 'dist/runtime-diagnostics/explicit-folder-startup.log' -Force
            }
            if (Test-Path $hostLog) {
              Copy-Item $hostLog 'dist/runtime-diagnostics/explicit-folder-host.log' -Force
            }
            Get-Process -Name 'Xplorer.Native' -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.Dispose()
          }

      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-runtime-startup-log
          path: dist/runtime-diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 7
